services:
  postgres:
    image: postgres:16
    hostname: postgres
    networks:
      iceberg_net:
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-oneshop}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres/postgres_bootstrap.sql:/docker-entrypoint-initdb.d/postgres_bootstrap.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      start_period: 60s
  spark-iceberg:
    image: tabulario/spark-iceberg
    networks:
      iceberg_net:
    depends_on:
      - rest
      - seaweedfs
    volumes:
      - ./spark/scripts:/home/iceberg/pyspark/scripts
      - ./notebooks:/home/iceberg/notebooks
      - ./spark/jars:/home/iceberg/pyspark/jars
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      - AWS_REGION=us-east-1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-oneshop}
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001
    
  rest:
    image: apache/iceberg-rest-fixture
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://seaweedfs:8333
      - CATALOG_S3_PATH__STYLE__ACCESS=true
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    networks:
      iceberg_net:
    ports:
      - 8333:8333
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
  warehouse-init:
    depends_on:
      - seaweedfs
    image: amazon/aws-cli:latest
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      - AWS_REGION=us-east-1
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket warehouse >/dev/null 2>&1; do
          if aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket warehouse; then
            break
          fi
          echo "Waiting for SeaweedFS S3..."
          sleep 1
        done
  loadgen:
    build: loadgen
    init: true
    networks:
      iceberg_net:
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      - S3_ENDPOINT=http://seaweedfs:8333
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-oneshop}

  trino:
    image: trinodb/trino:latest
    hostname: trino
    networks:
      iceberg_net:
    depends_on:
      - rest
      - seaweedfs
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./iceberg-schema-gold.sql:/opt/trino/iceberg-schema-gold.sql:ro
    ports:
      - "9090:8443"

  superset:
    build: ./superset
    networks:
      iceberg_net:
    depends_on:
      superset-db:
        condition: service_healthy
      trino:
        condition: service_started
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      - ADMIN_USERNAME=${SUPERSET_ADMIN_USERNAME:?Set SUPERSET_ADMIN_USERNAME in .env}
      - ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
      - ADMIN_FIRST_NAME=Superset
      - ADMIN_LAST_NAME=Admin
      - ADMIN_EMAIL=admin@example.com
      - DATABASE_URL=${SUPERSET_DATABASE_URL:?Set SUPERSET_DATABASE_URL in .env}
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username "$${ADMIN_USERNAME}" --firstname "$${ADMIN_FIRST_NAME}" --lastname "$${ADMIN_LAST_NAME}" --email "$${ADMIN_EMAIL}" --password "$${ADMIN_PASSWORD}" || true) &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088

  superset-db:
    image: postgres:15
    networks:
      iceberg_net:
    environment:
      - POSTGRES_DB=superset
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD in .env}
    volumes:
      - ./superset/superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      iceberg_net:

  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      iceberg_net:

  kafka:
    image: bitnamilegacy/kafka:3.6
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      iceberg_net:

  connect:
    build:
      context: ./kafka-connect
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      PLUGIN_PATH: /kafka/connect
    networks:
      iceberg_net:

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      iceberg_net:

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    networks:
      iceberg_net:

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    volumes:
      - ./clickhouse/init.sql:/opt/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      - kafka
    networks:
      iceberg_net:

  streamlit:
    build:
      context: ./streamlit
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: oneshop
    ports:
      - "8501:8501"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      iceberg_net:

  jobmanager:
    image: flink:1.17.2-scala_2.12-java11
    command: jobmanager
    ports:
      - "8082:8081"
    volumes:
      - ./flink-sql:/opt/flink/flink-sql:ro
      - ./flink-connectors/flink-sql-connector-kafka-1.17.2.jar:/opt/flink/lib/flink-sql-connector-kafka-1.17.2.jar:ro
      - ./ip_geo.csv:/opt/flink/ip_geo.csv:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    depends_on:
      - kafka
    networks:
      iceberg_net:

  taskmanager:
    image: flink:1.17.2-scala_2.12-java11
    command: taskmanager
    volumes:
      - ./flink-connectors/flink-sql-connector-kafka-1.17.2.jar:/opt/flink/lib/flink-sql-connector-kafka-1.17.2.jar:ro
      - ./ip_geo.csv:/opt/flink/ip_geo.csv:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 20
    depends_on:
      - jobmanager
    networks:
      iceberg_net:

  login-simulator:
    build:
      context: ./simulator
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      iceberg_net:

networks:
  iceberg_net:

volumes:
  clickhouse_data: